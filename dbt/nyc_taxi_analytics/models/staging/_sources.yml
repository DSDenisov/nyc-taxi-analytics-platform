sources:
  - name: raw
    database: nyc_taxi_analytics
    schema: raw
    tables:
      - name: yellow_tripdata
        description: > 
            Raw NYC TLC Yellow Taxi trip records, loaded via COPY INTO from the S3 external stage. 
            Known data quality issue: insignificant amount of records have incorrect pickup/dropoff timestamps
            issue will be addressed in intermediate layer  
        columns:
          - name: VENDORID
            description: >
                A code indicating the TPEP provider that provided the record.
                1 = Creative Mobile Technologies, LLC
                2 = Curb Mobility, LLC
                6 = Myle Technologies Inc
                7 = Helix
          - name: TPEP_PICKUP_DATETIME 
            description: The date and time when the meter was engaged.
          - name: TPEP_DROPOFF_DATETIME 
            description: The date and time when the meter was disengaged.
          - name: PASSENGER_COUNT 
            description: The number of passengers in the vehicle.
          - name: TRIP_DISTANCE 
            description: The elapsed trip distance in miles reported by the taximeter.
          - name: RATECODEID
            description: > 
                The final rate code in effect at the end of the trip.
                1 = Standard rate
                2 = JFK
                3 = Newark
                4 = Nassau or Westchester
                5 = Negotiated fare
                6 = Group ride
                99 = Null/unknown
          - name: STORE_AND_FWD_FLAG
            description: >
                This flag indicates whether the trip record was held in vehicle memory before
                sending to the vendor, aka “store and forward,” because the vehicle did not
                have a connection to the server.
                Y = store and forward trip
                N = not a store and forward trip
          - name: PULOCATIONID 
            description: TLC Taxi Zone in which the taximeter was engaged.
          - name: DOLOCATIONID 
            description: TLC Taxi Zone in which the taximeter was disengaged.
          - name: PAYMENT_TYPE
            description: >
                A numeric code signifying how the passenger paid for the trip.
                0 = Flex Fare trip
                1 = Credit card
                2 = Cash
                3 = No charge
                4 = Dispute
                5 = Unknown
                6 = Voided trip
          - name: FARE_AMOUNT
            description: >
                The time-and-distance fare calculated by the meter. For additional
                information on the following columns, see
                https://www.nyc.gov/site/tlc/passengers/taxi-fare.page
                extra Miscellaneous extras and surcharges.
          - name: EXTRA
            description: Miscellaneous extras and surcharges.
          - name: MTA_TAX 
            description: Tax that is automatically triggered based on the metered rate in use.
          - name: TIP_AMOUNT 
            description: Tip amount - This field is automatically populated for credit card tips. Cash tips are not included.
          - name: TOLLS_AMOUNT
            description: Total amount of all tolls paid in trip.
          - name: IMPROVEMENT_SURCHARGE 
            description: Improvement surcharge assessed trips at the flag drop. The improvement surcharge began being levied in 2015.
          - name: TOTAL_AMOUNT 
            description: The total amount charged to passengers. Does not include cash tips.
          - name: CONGESTION_SURCHARGE 
            description: Total amount collected in trip for NYS congestion surcharge.
          - name: AIRPORT_FEE 
            description: For pick up only at LaGuardia and John F. Kennedy Airports.
          - name: CBD_CONGESTION_FEE 
            description: Per-trip charge for MTA's Congestion Relief Zone starting Jan. 5, 2025.

          - name: _INGESTED_AT
            description: date time of date ingestion into Snowflake table
          - name: _SOURCE_FILE 
            description: source file name (parquet)